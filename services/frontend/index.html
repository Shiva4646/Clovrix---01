<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clovrix – AI Governance Platform</title>
    <meta name="description" content="AI Governance, Risk &amp; Compliance | ISO 42001 · NIST AI RMF · SOC 2 · GDPR" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Flash-free theme: apply saved theme vars before React mounts -->
    <script>
(function(){try{
  var v={'midnight':{'--c-bg':'#0a0a18','--c-bg2':'#111128','--c-bg3':'#16163a','--c-border':'#1e1e48','--c-border2':'#2a2a60','--c-text':'#f0f0ff','--c-text2':'#9898c8','--c-text3':'#5858a0','--c-accent':'#7c6af7','--c-accent2':'#22d3ee','--c-green':'#22c55e','--c-red':'#f43f5e','--c-yellow':'#fbbf24','--c-orange':'#fb923c','--c-pink':'#e879f9','--c-sidebar':'#0e0e24','--c-topbar':'#0e0e24','--c-scrollbar':'#2a2a60'},
  'dark':{'--c-bg':'#0f1117','--c-bg2':'#13162a','--c-bg3':'#1a1d2e','--c-border':'#1e2140','--c-border2':'#2d3150','--c-text':'#e8eaf0','--c-text2':'#a0aec0','--c-text3':'#4b5280','--c-accent':'#6366f1','--c-accent2':'#0d9488','--c-green':'#10b981','--c-red':'#ef4444','--c-yellow':'#f59e0b','--c-orange':'#f97316','--c-pink':'#ec4899','--c-sidebar':'#13162a','--c-topbar':'#13162a','--c-scrollbar':'#2d3150'},
  'ocean':{'--c-bg':'#060e1a','--c-bg2':'#0a1628','--c-bg3':'#0f1f38','--c-border':'#162845','--c-border2':'#1e3860','--c-text':'#e0f2fe','--c-text2':'#7fb3d3','--c-text3':'#3a6080','--c-accent':'#0ea5e9','--c-accent2':'#06b6d4','--c-green':'#10b981','--c-red':'#f43f5e','--c-yellow':'#fbbf24','--c-orange':'#f97316','--c-pink':'#818cf8','--c-sidebar':'#080e1a','--c-topbar':'#080e1a','--c-scrollbar':'#1e3860'},
  'light':{'--c-bg':'#f4f6fa','--c-bg2':'#ffffff','--c-bg3':'#eef1f7','--c-border':'#dde1eb','--c-border2':'#c8ceda','--c-text':'#0d1117','--c-text2':'#374151','--c-text3':'#6b7280','--c-accent':'#4f46e5','--c-accent2':'#0891b2','--c-green':'#059669','--c-red':'#dc2626','--c-yellow':'#b45309','--c-orange':'#c2410c','--c-pink':'#be185d','--c-sidebar':'#f0f3f9','--c-topbar':'#f0f3f9','--c-scrollbar':'#dde1eb'}};
  var t=localStorage.getItem('clovrix_theme')||'midnight';
  var th=v[t]||v['midnight'];
  Object.entries(th).forEach(function(e){document.documentElement.style.setProperty(e[0],e[1]);});
}catch(e){}}())
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
