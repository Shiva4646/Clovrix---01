version: '3.9'

# ══════════════════════════════════════════════════════════════════════════════
# Clovrix — Full Production Stack
# Services: Traefik · API · Worker · Frontend · PostgreSQL · PgBouncer
#           Valkey · RabbitMQ · Keycloak · MinIO · OpenBao · Qdrant
#           Meilisearch · Ollama · Prometheus · Grafana · Loki · Jaeger · MailHog
# ══════════════════════════════════════════════════════════════════════════════

x-common-env: &common-env
  ASPNETCORE_ENVIRONMENT: Development
  DATABASE_URL: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Pooling=false"
  HANGFIRE_DB_URL: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Pooling=false"
  VALKEY_URL: "valkey:6379,password=${VALKEY_PASSWORD}"
  RABBITMQ_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672"
  KEYCLOAK_URL: "http://keycloak:8080"
  KEYCLOAK_REALM: "${KEYCLOAK_REALM}"
  KEYCLOAK_CLIENT_ID: "${KEYCLOAK_CLIENT_ID}"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_PUBLIC_ENDPOINT: "localhost:9000"
  MINIO_ACCESS_KEY: "${MINIO_ROOT_USER}"
  MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
  OPENBAO_ADDR: "${OPENBAO_ADDR}"
  OPENBAO_TOKEN: "${OPENBAO_ROOT_TOKEN}"
  MEILI_URL: "http://meilisearch:7700"
  MEILI_MASTER_KEY: "${MEILI_MASTER_KEY}"
  QDRANT_URL: "http://qdrant:6333"
  OLLAMA_URL: "http://ollama:11434"
  OLLAMA_MODEL: "${OLLAMA_MODEL}"
  SMTP_HOST: "${SMTP_HOST}"
  SMTP_PORT: "${SMTP_PORT}"
  SMTP_FROM: "${SMTP_FROM}"
  JAEGER_ENDPOINT: "http://jaeger:4317"
  FRONTEND_URL: "${FRONTEND_URL}"
  JWT_SECRET: "${JWT_SECRET}"

services:

  # ── Traefik v3 (Reverse Proxy + Rate Limiting) ────────────────────────────
  traefik:
    image: traefik:v3.0
    container_name: clovrix-traefik
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.middlewares=rate-limit@file
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infrastructure/traefik:/etc/traefik/dynamic:ro
    networks: [clovrix-net]
    restart: unless-stopped

  # ── ASP.NET Core 8 API ───────────────────────────────────────────────────
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: clovrix-api
    environment:
      <<: *common-env
      ASPNETCORE_URLS: http://+:8080
      RUN_MODE: api
    ports:
      - "5000:8080"
    depends_on:
      postgres:   { condition: service_healthy }
      pgbouncer:  { condition: service_started }
      valkey:     { condition: service_healthy }
      rabbitmq:   { condition: service_healthy }
      minio:      { condition: service_healthy }
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=PathPrefix(`/api`) || PathPrefix(`/swagger`) || PathPrefix(`/health`)
      - traefik.http.services.api.loadbalancer.server.port=8080
    networks: [clovrix-net]
    volumes:
      - api-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── Background Worker (same image, worker role) ──────────────────────────
  worker:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: clovrix-worker
    environment:
      <<: *common-env
      ASPNETCORE_URLS: http://+:8081
      RUN_MODE: worker
    depends_on:
      api: { condition: service_healthy }
    networks: [clovrix-net]
    restart: unless-stopped

  # ── MCP Server (Model Context Protocol — SSE transport) ─────────────────
  # Disabled: service not yet implemented
  # mcp-server:
  #   build:
  #     context: ./services/mcp-server
  #     dockerfile: Dockerfile
  #   container_name: clovrix-mcp
  #   environment:
  #     <<: *common-env
  #     ASPNETCORE_URLS: http://+:8080
  #   ports:
  #     - "5100:8080"
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     api:      { condition: service_healthy }
  #   networks: [clovrix-net]
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
  #     interval: 20s
  #     timeout: 10s
  #     retries: 5

  # ── Vite + React Frontend ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000
        - VITE_TENANT_ID=demo
        - VITE_KEYCLOAK_URL=http://localhost:8180
    container_name: clovrix-frontend
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_KEYCLOAK_URL: http://localhost:8180
      VITE_TENANT_ID: demo
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      api: { condition: service_healthy }
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.services.frontend.loadbalancer.server.port=3000
    networks: [clovrix-net]
    restart: unless-stopped

  # ── PostgreSQL 16 ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: clovrix-postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Auto-init: these run in filename order the first time the DB volume is
      # created, so the audit-cycle tables + full control libraries are ALWAYS
      # present on a fresh start (no manual seeding, and they can't "disappear").
      - ./infrastructure/postgres/clovrix-init.sql:/docker-entrypoint-initdb.d/01-clovrix-init.sql:ro
      - ./infrastructure/postgres/migrations/2026-07-08_audit_cycle.sql:/docker-entrypoint-initdb.d/02-audit-cycle.sql:ro
      - ./infrastructure/postgres/migrations/2026-07-10_integrity.sql:/docker-entrypoint-initdb.d/03-integrity.sql:ro
      - ./infrastructure/postgres/migrations/2026-07-10_reporting.sql:/docker-entrypoint-initdb.d/04-reporting.sql:ro
      - ./infrastructure/postgres/seeds/framework_controls_seed.sql:/docker-entrypoint-initdb.d/05-framework-controls.sql:ro
      - ./infrastructure/postgres/seeds/framework_controls_extra_seed.sql:/docker-entrypoint-initdb.d/06-framework-controls-extra.sql:ro
      - ./infrastructure/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [clovrix-net]
    restart: unless-stopped

  # ── PgBouncer (Connection Pooling — essential for multi-tenant load) ──────
  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    container_name: clovrix-pgbouncer
    environment:
      DATABASES_HOST: postgres
      DATABASES_PORT: 5432
      DATABASES_DBNAME: "${POSTGRES_DB}"
      DATABASES_USER: "${POSTGRES_USER}"
      DATABASES_PASSWORD: "${POSTGRES_PASSWORD}"
      PGBOUNCER_POOL_MODE: "${PGBOUNCER_POOL_MODE}"
      PGBOUNCER_MAX_CLIENT_CONN: "${PGBOUNCER_MAX_CLIENT_CONN}"
      PGBOUNCER_DEFAULT_POOL_SIZE: "${PGBOUNCER_DEFAULT_POOL_SIZE}"
      PGBOUNCER_SERVER_RESET_QUERY: DISCARD ALL
      PGBOUNCER_AUTH_TYPE: md5
    ports:
      - "6432:5432"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [clovrix-net]
    restart: unless-stopped

  # ── Valkey 7 (Redis-compatible, BSD-3 license) ────────────────────────────
  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: clovrix-valkey
    command: >
      valkey-server
      --requirepass ${VALKEY_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a ${VALKEY_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [clovrix-net]
    restart: unless-stopped

  # ── RabbitMQ 3.13 (Quorum Queues for durability) ──────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: clovrix-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
      RABBITMQ_DEFAULT_VHOST: "/"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks: [clovrix-net]
    restart: unless-stopped

  # ── Keycloak 24 (IAM — SSO/SAML/OIDC/MFA) ───────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: clovrix-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}"
      KC_DB_USERNAME: "${POSTGRES_USER}"
      KC_DB_PASSWORD: "${POSTGRES_PASSWORD}"
      KC_DB_SCHEMA: keycloak
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_LOG_LEVEL: INFO
    ports:
      - "8180:8080"
    volumes:
      - ./infrastructure/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [clovrix-net]
    restart: unless-stopped

  # ── MinIO (S3-compatible Object Storage — AGPL self-hosted) ───────────────
  minio:
    image: minio/minio:latest
    container_name: clovrix-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      MINIO_REGION: "${MINIO_REGION}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [clovrix-net]
    restart: unless-stopped

  # ── OpenBao (Vault fork, MPL 2.0 — Secrets Management) ───────────────────
  openbao:
    image: openbao/openbao:latest
    container_name: clovrix-openbao
    cap_add: [IPC_LOCK]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: "${OPENBAO_ROOT_TOKEN}"
      BAO_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    command: server -dev
    ports:
      - "8200:8200"
    networks: [clovrix-net]
    restart: unless-stopped

  # ── Qdrant (Vector DB for AI RAG — Apache 2.0) ───────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: clovrix-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks: [clovrix-net]
    restart: unless-stopped

  # ── Meilisearch (Full-text Search — MIT) ─────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: clovrix-meilisearch
    environment:
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY}"
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilisearch-data:/meili_data
    networks: [clovrix-net]
    restart: unless-stopped

  # ── Ollama (Local LLM — MIT) ──────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: clovrix-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks: [clovrix-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Ollama model initialiser (pulls model once, then exits) ───────────────
  ollama-init:
    image: ollama/ollama:latest
    container_name: clovrix-ollama-init
    volumes:
      - ollama-data:/root/.ollama
    networks: [clovrix-net]
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      sh -c "ollama pull ${OLLAMA_MODEL:-llama3.2:1b} && echo 'Model ready'"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

    # Uncomment for NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Prometheus (Metrics — Apache 2.0) ────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: clovrix-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [clovrix-net]
    restart: unless-stopped

  # ── Grafana (Dashboards — AGPL self-hosted) ──────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: clovrix-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]
    networks: [clovrix-net]
    restart: unless-stopped

  # ── Loki (Log Aggregation — Apache 2.0) ──────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: clovrix-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks: [clovrix-net]
    restart: unless-stopped

  # ── Jaeger (Distributed Tracing — Apache 2.0) ────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: clovrix-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks: [clovrix-net]
    restart: unless-stopped

  # ── MailHog (Dev SMTP — MIT) ──────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: clovrix-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks: [clovrix-net]
    restart: unless-stopped

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  clovrix-net:
    driver: bridge
    # Subnet is auto-assigned by Docker to avoid clashes with other networks.
    # (Previously pinned to 172.21.0.0/16, which overlapped an existing network.)

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  valkey-data:
  rabbitmq-data:
  minio-data:
  qdrant-data:
  meilisearch-data:
  prometheus-data:
  grafana-data:
  loki-data:
  ollama-data:
  api-logs:
