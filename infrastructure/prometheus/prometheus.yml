global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: clovrix-api
    static_configs:
      - targets: ['api:8080']
    metrics_path: /metrics
  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']
    metrics_path: /metrics
  - job_name: minio
    static_configs:
      - targets: ['minio:9000']
    metrics_path: /minio/v2/metrics/cluster
